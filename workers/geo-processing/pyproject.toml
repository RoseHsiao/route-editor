[project]
name = "routeeditor-geo-worker"
version = "0.2.0"
description = "RouteEditor geospatial processing worker: import, validation and route profiles."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "shapely>=2.2,<3",
  "pyproj>=3.8,<4",
  "psycopg[binary]>=3.3,<4",
  "defusedxml>=0.7.1,<1",
  "boto3>=1.40,<2",
  "numpy>=2.2,<3",
]
# GeoPandas and Rasterio are added when they are first needed (DEM fallback is
# deferred; see docs/adr/0009-elevation-processing.md).

[project.scripts]
trailworker = "trailworker.main:main"

[dependency-groups]
dev = [
  "pytest>=9.2",
  "ruff>=0.17",
  "mypy>=2.4",
  "jsonschema>=4.25,<5",
  "types-defusedxml>=0.7.0.20260504",
  "boto3-stubs[s3]>=1.43.123",
  "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trailworker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: needs the PostGIS test database (TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "RUF", "SIM", "PTH"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "E501"]

[tool.mypy]
files = ["src", "tests"]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["gpxpy.*", "shapely.*", "pyproj.*"]
ignore_missing_imports = true
