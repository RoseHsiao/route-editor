# Local development services for RouteEditor.
# Not intended for production. Credentials here are local-only defaults.
#
# The default image is the multi-arch (amd64 + arm64) build of docker-postgis,
# published by the docker-postgis maintainer. The official postgis/postgis
# images are amd64-only, which is slow under emulation on Apple Silicon.
# Override with POSTGIS_IMAGE=postgis/postgis:17-3.5 if you prefer.

name: trailplanner

services:
  db:
    image: ${POSTGIS_IMAGE:-imresamu/postgis:17-3.5}
    environment:
      POSTGRES_USER: trailplanner
      POSTGRES_PASSWORD: trailplanner
      POSTGRES_DB: trailplanner
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trailplanner -d trailplanner"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  db-data:
